<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Rounded Canvas -->
  <rect width="64" height="64" rx="14" fill="#0B0B0D" />
  
  <!-- Subtle Border Ring -->
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#FF6D1F" stroke-width="2" stroke-opacity="0.3" />

  <!-- Pilot Terminal Chevron '>' -->
  <path 
    d="M18 20L32 32L18 44" 
    stroke="#FF6D1F" 
    stroke-width="5.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- API Pulse / Pilot Underscore '_' -->
  <line 
    x1="36" 
    y1="44" 
    x2="48" 
    y2="44" 
    stroke="#FFFFFF" 
    stroke-width="5.5" 
    stroke-linecap="round" 
  />

  <!-- Top Accent Pilot Dot -->
  <circle cx="44" cy="22" r="3.5" fill="#FF6D1F" />
</svg>